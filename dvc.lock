      hash: md5
      md5: ae671028d85362c34d1d72099bb40a86
      size: 16582
    - path: reports/audit/summary.json
      hash: md5
      md5: 40b342536717e569b758d066357e534e
      size: 2940
  split:
    cmd: python -m deepvision.data.split --manifest 
      data/processed/audit/manifest.csv --exact-duplicates 
      reports/audit/exact_duplicates.csv --near-duplicates 
      reports/audit/near_duplicate_candidates.csv --output 
      data/processed/splits/splits.csv --summary reports/splits/summary.json 
      --val-fraction 0.15 --seed 42
    deps:
    - path: data/processed/audit/manifest.csv
      hash: md5
      md5: b6068a3fbbf27830bfd5eb55f89c71d5
      size: 5460948
    - path: reports/audit/exact_duplicates.csv
      hash: md5
