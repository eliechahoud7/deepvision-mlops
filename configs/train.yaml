# Initial training configuration for DeepVision.
# Conservative defaults sized for a 2 GB VRAM GPU (GeForce MX450).

seed: 42

data:
  config: configs/data.yaml  # Manifest (split.output) and image root (archive.output) come from here
  class_names: [buildings, forest, glacier, mountain, sea, street]  # Index order used by the model
  num_classes: 6
  image_size: 224
  eval_batch_size: 64    # No gradients during evaluation, so larger batches fit in 2 GB
  num_workers: 2         # Keep low on Windows; raise if data loading is a bottleneck
  pin_memory: true       # Applied only when running on CUDA
  augmentation:          # Training split only
    crop_scale: [0.6, 1.0]
    horizontal_flip: 0.5
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.02

model:
  backbone: resnet18     # Any torchvision classification model name, e.g. mobilenet_v3_small
  pretrained: true       # Weights are fetched only when training starts
  freeze_backbone: true  # Train the classifier head first
  dropout: 0.2

training:
  epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 2   # Effective batch size of 32
  mixed_precision: true            # Reduces VRAM use on CUDA
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 3
  device: auto                     # cuda if available, otherwise cpu

output:
  checkpoint_dir: artifacts/checkpoints

mlflow:
  tracking_uri: mlruns
  experiment_name: deepvision-baseline
