vars:
  - configs/data.yaml

stages:
  extract:
    cmd: >-
      python -m deepvision.data.archive
      --archive ${archive.path}
      --output ${archive.output}
      --sha256 ${archive.sha256}
      --max-entries ${archive.limits.max_entries}
      --max-file-bytes ${archive.limits.max_file_bytes}
      --max-total-bytes ${archive.limits.max_total_bytes}
      --max-compression-ratio ${archive.limits.max_compression_ratio}
    deps:
      - ${archive.path}
      - src/deepvision/data/archive.py
    params:
      - configs/data.yaml:
          - archive
    outs:
      - ${archive.output}:
          cache: false  # Rebuilt from the cached ZIP; avoids a second copy in the cache

  audit:
    cmd: >-
      python -m deepvision.data.audit
      --input ${archive.output}
      --output-dir ${audit.output_dir}
      --manifest ${audit.manifest}
      --expected-width ${audit.expected.width}
      --expected-height ${audit.expected.height}
      --expected-mode ${audit.expected.mode}
      --expected-format ${audit.expected.format}
      --dhash-max-distance ${audit.near_duplicates.dhash_max_distance}
      --phash-max-distance ${audit.near_duplicates.phash_max_distance}
      --block-size ${audit.near_duplicates.block_size}
    deps:
      - ${archive.output}
      - src/deepvision/data/audit.py
    params:
      - configs/data.yaml:
          - audit
    outs:
      - ${audit.manifest}
      # Small review reports are committed to Git rather than cached.
      - ${audit.output_dir}/image_issues.csv:
          cache: false
      - ${audit.output_dir}/exact_duplicates.csv:
          cache: false
      - ${audit.output_dir}/near_duplicate_candidates.csv:
          cache: false
    metrics:
      - ${audit.output_dir}/summary.json:
          cache: false

  split:
    cmd: >-
      python -m deepvision.data.split
      --manifest ${audit.manifest}
      --exact-duplicates ${audit.output_dir}/exact_duplicates.csv
      --near-duplicates ${audit.output_dir}/near_duplicate_candidates.csv
      --output ${split.output}
      --summary ${split.summary}
      --val-fraction ${split.val_fraction}
      --seed ${split.seed}
    deps:
      - ${audit.manifest}
      - ${audit.output_dir}/exact_duplicates.csv
      - ${audit.output_dir}/near_duplicate_candidates.csv
      - src/deepvision/data/split.py
    params:
      - configs/data.yaml:
          - split
    outs:
      - ${split.output}
    metrics:
      - ${split.summary}:
          cache: false

  train:
    # DVC reruns stages from scratch, so existing training state is replaced (--restart).
    # To finish an interrupted run instead: run the module with --resume, then `dvc commit train`.
    cmd: python -m deepvision.training.train --config configs/train.yaml --restart
    deps:
      - ${split.output}
      - ${archive.output}
      - src/deepvision/data/dataset.py
      - src/deepvision/data/transforms.py
      - src/deepvision/models
      - src/deepvision/training
    params:
      - configs/train.yaml:
          - seed
          - data
          - model
          - training
    outs:
      - artifacts/checkpoints/best.pt
    metrics:
      - reports/training/metrics.json:
          cache: false
    plots:
      - reports/training/history.csv:
          cache: false

  evaluate:
    # Held-out test evaluation of the trained checkpoint; see docs/evaluation.md.
    cmd: python -m deepvision.evaluation.evaluate --config configs/evaluate.yaml
    deps:
      - artifacts/checkpoints/best.pt
      - ${split.output}
      - ${archive.output}
      - src/deepvision/data/dataset.py
      - src/deepvision/data/transforms.py
      - src/deepvision/models
      - src/deepvision/evaluation
    params:
      - configs/evaluate.yaml:
      - configs/train.yaml:
          - data
    metrics:
      - reports/evaluation/metrics.json:
          cache: false
    outs:
      - reports/evaluation/per_class.csv:
          cache: false
      - reports/evaluation/confusion_matrix.csv:
          cache: false
      - reports/evaluation/excluded_predictions.csv:
          cache: false
      - reports/evaluation/errors.csv:
          cache: false
    plots:
      - reports/evaluation/predictions.csv:
          cache: false
          template: confusion
          x: label
          y: predicted
          title: Clean test confusion matrix

  drift:
    # Evidently data drift: unlabelled pred images vs validation; see docs/drift.md.
    # Never reads the held-out test splits.
    cmd: python -m deepvision.monitoring.drift --config configs/drift.yaml
    deps:
      - artifacts/checkpoints/best.pt
      - ${split.output}
      - ${archive.output}
      - src/deepvision/data/dataset.py
      - src/deepvision/data/transforms.py
      - src/deepvision/models
      - src/deepvision/evaluation/checkpoint.py
      - src/deepvision/inference
      - src/deepvision/monitoring
    params:
      - configs/drift.yaml:
      - configs/train.yaml:
          - data
    outs:
      - data/processed/drift/reference.csv
      - data/processed/drift/current.csv
      - reports/drift/report.html   # ~5 MB interactive report: DVC cache, not Git
    metrics:
      - reports/drift/summary.json:
          cache: false

plots:
  - Training and validation loss:
      template: linear
      x: epoch
      y:
        reports/training/history.csv: [train_loss, val_loss]
  - Validation accuracy and macro-F1:
      template: linear
      x: epoch
      y:
        reports/training/history.csv: [val_accuracy, val_macro_f1]
