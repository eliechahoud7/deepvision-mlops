      md5: 9ae19279b0dad442847416372414bd60.dir
      size: 368859597
      nfiles: 24335
    - path: src/deepvision/data/audit.py
      hash: md5
      md5: 81504692477fce4a3f2f8d30539aba58
      size: 17955
    params:
      configs/data.yaml:
        audit:
          output_dir: reports/audit
          manifest: data/processed/audit/manifest.csv
          expected:
            width: 150
            height: 150
            mode: RGB
            format: JPEG
          near_duplicates:
            dhash_max_distance: 6
            phash_max_distance: 6
            block_size: 1024
    outs:
    - path: data/processed/audit/manifest.csv
      hash: md5
      md5: b6068a3fbbf27830bfd5eb55f89c71d5
