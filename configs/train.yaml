# Initial training configuration for DeepVision.
# Conservative defaults sized for a 2 GB VRAM GPU (GeForce MX450).

seed: 42

data:
  config: configs/data.yaml  # Manifest (split.output) and image root (archive.output) come from here
  class_names: [buildings, forest, glacier, mountain, sea, street]  # Index order used by the model
  num_classes: 6
  image_size: 224
  eval_batch_size: 64    # No gradients during evaluation, so larger batches fit in 2 GB
  num_workers: 2         # Keep low on Windows; raise if data loading is a bottleneck
  pin_memory: true       # Applied only when running on CUDA
  augmentation:          # Training split only
    crop_scale: [0.6, 1.0]
    horizontal_flip: 0.5
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.02

model:
  # Supported: resnet18, resnet34, resnet50, mobilenet_v3_small, mobilenet_v3_large, efficientnet_b0
  backbone: resnet18
  pretrained: true       # ImageNet weights, downloaded on first use (~45 MB for resnet18)
  dropout: 0.2           # Applied before the final classification layer

training:
  epochs: 10                       # Total across both fine-tuning phases
  batch_size: 32                   # Full fine-tuning peaks at ~600 MiB on the 2 GB GPU
  gradient_accumulation_steps: 1   # Fallback: halve batch_size and double this if CUDA runs out of memory
  mixed_precision: true            # FP16 autocast with gradient scaling on CUDA; full precision on CPU
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  device: auto                     # cuda if available, otherwise cpu
  fine_tune:
    head_epochs: 3                 # Phase 1: backbone frozen, only the classifier head trains
    head_learning_rate: 0.001      # Head learning rate in both phases
    backbone_learning_rate: 0.0001 # Phase 2: backbone unfrozen with this lower rate
  early_stopping:
    monitor: val_macro_f1          # Selected on validation only; the test set is never used
    mode: max
    patience: 3

output:
  checkpoint_dir: artifacts/checkpoints  # best.pt (DVC output) and last.pt (resume state, not tracked)
  reports_dir: reports/training          # metrics.json and history.csv, tracked in Git

mlflow:
  tracking_uri: sqlite:///mlflow.db  # MLflow 3 rejects the plain ./mlruns file store; artifacts still go to mlruns/
  experiment_name: deepvision-baseline
