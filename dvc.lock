      hash: md5
      md5: 11ecc13c417c96710cd9ac9645d2874e
      size: 12366
    params:
      configs/data.yaml:
        split:
          output: data/processed/splits/splits.csv
          summary: reports/splits/summary.json
          val_fraction: 0.15
          seed: 42
    outs:
    - path: data/processed/splits/splits.csv
      hash: md5
      md5: 15bbec95148c1fe89f481c02247b68e6
