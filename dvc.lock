      nfiles: 4
    params:
      configs/train.yaml:
        data:
          config: configs/data.yaml
          class_names:
          - buildings
          - forest
          - glacier
          - mountain
          - sea
          - street
          num_classes: 6
          image_size: 224
          eval_batch_size: 64
          num_workers: 2
          pin_memory: true
          augmentation:
            crop_scale:
            - 0.6
            - 1.0
            horizontal_flip: 0.5
            color_jitter:
              brightness: 0.2
              contrast: 0.2
              saturation: 0.2
              hue: 0.02
        model:
          backbone: resnet18
          pretrained: true
          dropout: 0.2
        seed: 42
        training:
          epochs: 10
          batch_size: 32
          gradient_accumulation_steps: 1
          mixed_precision: true
          optimizer: adamw
          weight_decay: 0.0001
          scheduler: cosine
          device: auto
          fine_tune:
            head_epochs: 3
            head_learning_rate: 0.001
            backbone_learning_rate: 0.0001
          early_stopping:
            monitor: val_macro_f1
            mode: max
            patience: 3
