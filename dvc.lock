      data/interim/intel-image-classification --output-dir reports/audit 
      --manifest data/processed/audit/manifest.csv --expected-width 150 
      --expected-height 150 --expected-mode RGB --expected-format JPEG 
      --dhash-max-distance 6 --phash-max-distance 6 --block-size 1024
