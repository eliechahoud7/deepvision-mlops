# Prometheus configuration for the local monitoring stack (compose.yaml).
# Scrapes the inference API on the Compose network; nothing leaves the machine.

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: deepvision-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: deepvision-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
