# DeepVision inference service with a Streamlit frontend and local Prometheus + Grafana
# monitoring.
#
#   docker compose up --build -d     # build and start api, frontend, prometheus, grafana
#   docker compose up --build -d api # the API only
#   docker compose ps                # each service shows (healthy) once ready
#   docker compose down              # stop and remove (add -v to delete metric history)
#
# Frontend: http://127.0.0.1:8501   API: http://127.0.0.1:8000
# Prometheus: http://127.0.0.1:9090   Grafana: http://127.0.0.1:3000
# Every port is published on the host's loopback interface only.
#
# The checkpoint and its held-out evaluation report are bind-mounted read-only from the
# repository (produce them with `dvc repro` or `dvc pull`); they are not in the image.
# The API health check is defined in the Dockerfile (it polls /ready).
#
# Networks: Prometheus reaches the API on "inference"; Grafana reaches only Prometheus on
# "monitoring", so Grafana cannot call the API directly. The frontend shares only the
# "frontend" network with the API, so it cannot reach Prometheus or Grafana (or they it).
# Only the API loads the model; the frontend image contains no model code.

name: deepvision

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepvision-api:latest
    container_name: deepvision-api
    init: true
    restart: unless-stopped
    ports:
      # Host loopback only: the API has no authentication or TLS.
      - "127.0.0.1:${DEEPVISION_PORT:-8000}:8000"
    environment:
      DEEPVISION_DEVICE: cpu
      DEEPVISION_NUM_THREADS: ${DEEPVISION_NUM_THREADS:-}
      DEEPVISION_MAX_UPLOAD_MB: ${DEEPVISION_MAX_UPLOAD_MB:-10}
      DEEPVISION_MAX_BATCH: ${DEEPVISION_MAX_BATCH:-16}
    volumes:
      # Long syntax with create_host_path: false, so a missing file is an error instead
      # of Docker silently creating an empty directory at the host path.
      - type: bind
        source: ./artifacts/checkpoints/best.pt
        target: /app/artifacts/checkpoints/best.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./reports/evaluation/metrics.json
        target: /app/reports/evaluation/metrics.json
        read_only: true
        bind:
          create_host_path: false
    # Hardening: read-only root filesystem, no Linux capabilities, no privilege
    # escalation, non-root user (set in the Dockerfile), bounded resources.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 15s
    networks:
      - inference
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: deepvision-frontend:latest
    container_name: deepvision-frontend
    init: true
    restart: unless-stopped
    # Started, not healthy: the UI should come up and report "model not loaded" if the
    # API has no checkpoint.
    depends_on:
      api:
        condition: service_started
    ports:
      # Host loopback only.
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    environment:
      DEEPVISION_API_URL: http://api:8000
      # Same variables as the API, so the frontend's limits always match it.
      DEEPVISION_MAX_UPLOAD_MB: ${DEEPVISION_MAX_UPLOAD_MB:-10}
      DEEPVISION_MAX_BATCH: ${DEEPVISION_MAX_BATCH:-16}
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: ${DEEPVISION_MAX_UPLOAD_MB:-10}  # whole MB
    # Same hardening as the API; the health check (/_stcore/health) is in the Dockerfile.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 10s
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: deepvision-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      # Host loopback only: Prometheus has no authentication.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ./monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    # Same hardening as the API; the image already runs as the unprivileged "nobody" user.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    networks:
      - inference
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    container_name: deepvision-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      # Host loopback only.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in your shell or .env; the fallback is for local use only.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Dashboards are readable without logging in (Viewer role); editing requires admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Fully offline: no telemetry, update checks, news feed, Gravatar, or plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
    volumes:
      # Only these two provisioning folders: the image's empty plugins/ and alerting/
      # folders stay in place (Grafana logs errors if they are missing).
      - type: bind
        source: ./monitoring/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    # Same hardening as the API; the image already runs as the unprivileged "grafana" user.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  inference:
  monitoring:
  frontend:

volumes:
  prometheus-data:
  grafana-data:
