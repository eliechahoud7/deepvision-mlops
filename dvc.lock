    - path: src/deepvision/data/archive.py
      hash: md5
      md5: d028f8d64788cf02f5b18fa45c325dd2
      size: 12800
    params:
      configs/data.yaml:
        archive:
          path: data/raw/intel-image-classification.zip
          sha256: 
            3921405607c3e9d67a3459b6c629894c3a723aa1647f9310b6793da306e89337
