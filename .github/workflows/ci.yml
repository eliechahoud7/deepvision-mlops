# Continuous integration: lint, test, and build the inference and frontend images.
#
# Runs on pushes to main and on pull requests targeting main. Nothing is published:
# the Docker images are built and smoke-tested on the runner, never pushed. The trained
# checkpoint and dataset are DVC-tracked and not available here, so the tests use their
# own synthetic data (the one real-checkpoint test skips) and the container smoke tests
# (API alone, frontend alone, then the full Compose stack) check the "no model" path.
# Training and held-out evaluation never run in CI.
#
# Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Same versions as development and the Dockerfile, CPU builds (runners have no GPU).
  TORCH_VERSION: "2.5.1"
  TORCHVISION_VERSION: "0.20.1"
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff (version range from requirements-dev.txt)
        run: python -m pip install "$(grep -E '^ruff' requirements-dev.txt)"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            .github/workflows/ci.yml

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          "torch==${TORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}"
          --index-url "${TORCH_INDEX_URL}"

      - name: Install dependencies and the package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Show versions
        run: python -c "import torch, torchvision; print(torch.__version__, torchvision.__version__)"

      - name: Run tests
        run: python -m pytest

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate compose.yaml
        run: docker compose config --quiet

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: deepvision-api:ci
          build-args: |
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            TORCHVISION_VERSION=${{ env.TORCHVISION_VERSION }}
            TORCH_INDEX_URL=${{ env.TORCH_INDEX_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend.Dockerfile
          push: false
          load: true
          tags: deepvision-frontend:ci
          # Own cache scope, so the two images do not overwrite each other's layers.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test the container (no checkpoint mounted)
        run: |
          set -euo pipefail
          docker run -d --name deepvision-api -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges --init \
            deepvision-api:ci
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8000/health && break
            sleep 1
          done
          # Liveness passes; readiness reports the missing model without crashing.
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          code=$(curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:8000/ready)
          test "$code" = 503
          grep -q model_unavailable ready.json
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^deepvision_model_ready 0.0'
          # Image properties: non-root user and CPU-only PyTorch.
          test "$(docker exec deepvision-api id -u)" = 10001
          docker exec deepvision-api python -c \
            "import torch; assert torch.version.cuda is None, torch.__version__"
          docker image ls deepvision-api:ci
          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs deepvision-api 2>&1 || true

      - name: Remove container
        if: always()
        run: docker rm -f deepvision-api || true

      - name: Smoke test the frontend container (no API)
        run: |
          set -euo pipefail
          docker run -d --name deepvision-frontend -p 127.0.0.1:8501:8501 \
            --read-only --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges --init \
            deepvision-frontend:ci
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8501/_stcore/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok
          curl -fsS -o /dev/null http://127.0.0.1:8501/
          # Image properties: non-root, no model stack, telemetry and error details off.
          test "$(docker exec deepvision-frontend id -u)" = 10001
          docker exec deepvision-frontend python -c \
            "import importlib.util as u; assert u.find_spec('torch') is None"
          docker exec -w /app deepvision-frontend python -c "$(printf '%s\n' \
            'from streamlit import config' \
            'config.get_config_options(force_reparse=True)' \
            'assert config.get_option("browser.gatherUsageStats") is False' \
            'assert config.get_option("client.showErrorDetails") == "none"' \
            'assert config.get_option("logger.hideWelcomeMessage") is True')"
          # No public-IP lookup at startup (it would print an "External URL" line).
          # (An explicit if: set -e ignores a failing "! command".)
          if docker logs deepvision-frontend 2>&1 | grep -q "External URL"; then
            echo "the frontend looked up its public IP"; exit 1
          fi
          docker image ls deepvision-frontend:ci
          echo "Frontend smoke test passed"

      - name: Frontend container logs
        if: always()
        run: docker logs deepvision-frontend 2>&1 || true

      - name: Remove frontend container
        if: always()
        run: docker rm -f deepvision-frontend || true

      - name: Smoke test the Compose stack (compose.yaml)
        run: |
          set -euo pipefail
          # compose.yaml mounts the DVC-tracked checkpoint, which is not available in CI: an
          # empty placeholder makes the API start in its "model not ready" state.
          # Never overwrite an existing file.
          mkdir -p artifacts/checkpoints
          [ -e artifacts/checkpoints/best.pt ] || : > artifacts/checkpoints/best.pt
          docker tag deepvision-api:ci deepvision-api:latest
          docker tag deepvision-frontend:ci deepvision-frontend:latest
          docker compose up -d --no-build api
          docker compose up -d --no-build --wait --wait-timeout 120 prometheus grafana
          # Not part of --wait: that also waits for the frontend's dependency, the API, which
          # is deliberately unhealthy here (no checkpoint). Poll the frontend's own health.
          docker compose up -d --no-build frontend
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' deepvision-frontend)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' deepvision-frontend)" = healthy
          # The frontend reaches the API on its own network, but not Prometheus or Grafana.
          docker compose exec -T frontend python -c \
            "import httpx; assert httpx.get('http://api:8000/health', timeout=5).status_code == 200"
          for target in prometheus:9090 grafana:3000; do
            if docker compose exec -T frontend python -c \
              "import httpx; httpx.get('http://$target/', timeout=3)" 2>/dev/null; then
              echo "frontend must not reach $target"; exit 1
            fi
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok
          for _ in $(seq 1 30); do
            # "|| true": a failed attempt retries instead of ending the script (set -e).
            health=$(curl -fsS http://127.0.0.1:9090/api/v1/targets \
              | jq -r '.data.activeTargets[] | select(.labels.job == "deepvision-api") | .health') || true
            [ "$health" = up ] && break
            sleep 2
          done
          test "$health" = up
          ready=$(curl -fsS http://127.0.0.1:9090/api/v1/query --data-urlencode 'query=deepvision_model_ready' \
            | jq -r '.data.result[0].value[1]')
          test "$ready" = 0
          rules=$(curl -fsS http://127.0.0.1:9090/api/v1/rules | jq '[.data.groups[].rules[] | select(.health == "ok")] | length')
          test "$rules" = 7
          curl -fsS http://127.0.0.1:3000/api/health | jq -e '.database == "ok"'
          curl -fsS 'http://127.0.0.1:3000/api/search?query=DeepVision' | jq -e 'any(.[]; .uid == "deepvision-api")'
          echo "Compose stack smoke test passed"

      - name: Compose stack logs
        if: always()
        run: docker compose logs --no-color --tail 50 || true

      - name: Stop the Compose stack
        if: always()
        run: docker compose down -v || true

  monitoring-config:
    name: Prometheus config and alert rule tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check config, lint rules, and run rule unit tests (promtool)
        run: |
          set -euo pipefail
          # Same pinned image as compose.yaml.
          image=$(docker compose config --images | grep '^prom/prometheus')
          promtool() {
            docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
              -w /etc/prometheus --entrypoint promtool "$image" "$@"
          }
          promtool check config --lint=all --lint-fatal prometheus.yml
          promtool check rules --lint=all --lint-fatal rules/deepvision.yml
          promtool test rules tests/deepvision_rules_test.yml
