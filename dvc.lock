      data/interim/intel-image-classification --sha256 
      3921405607c3e9d67a3459b6c629894c3a723aa1647f9310b6793da306e89337 
      --max-entries 30000 --max-file-bytes 5242880 --max-total-bytes 1073741824 
      --max-compression-ratio 100.0
